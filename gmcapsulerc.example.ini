; Move this file to ~/.gmcapsule or modify your existing gmcapsule configuration
; Replace the `skylab_cwd` with the directory of wherever you are putting your skylab executable. Replace `skylab_host` with the hostname you are using for Skylab (which must also be defined in `server:host` somewhere). Do not change the [cgi.skylab] block.

[server]
host  = satch.xyz mail.satch.xyz

[titan]

[static]

[cgi]
bin_root = ./cgi-bin

[DEFAULT]
skylab_host = mail.satch.xyz
skylab_cwd = ./skylab/cgi

[cgi.skylab]
host = %(skylab_host)s
path = / /*
cwd = %(skylab_cwd)s
command = ./skylab
