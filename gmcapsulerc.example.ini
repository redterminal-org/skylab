; Move this file to ~/.gmcapsule or modify your existing gmcapsule configuration
; Replace the `skylab:cwd` with the directory of wherever you are putting your skylab executables. Replace `skylab:host` with the hostname you are using for Skylab (which must also be defined in `server:host` somewhere). Do not change the path configuration.
; Remember that the `users` directory and `users.yaml` file must be in the same directory as the directory which your cgi files live in
; Skylab will look for them at `../users/` and `../users.yaml`

[server]
host  = satch.xyz mail.satch.xyz

[titan]

[static]

[cgi]
bin_root = ./cgi-bin

[DEFAULT]
skylab_host = mail.satch.xyz
skylab_cwd = ./skylab/cgi

[cgi.root]
host = %(skylab_host)s
path = / /index.gmi
cwd = %(skylab_cwd)s
command = ./home

[cgi.tag]
host = %(skylab_host)s
path = /tag/*
cwd = %(skylab_cwd)s
command = ./tag

[cgi.reply]
host = %(skylab_host)s
path = /reply/*
cwd = %(skylab_cwd)s
command = ./reply

[cgi.compose]
host = %(skylab_host)s
path = /compose/*
cwd = %(skylab_cwd)s
command = ./compose

; You will need to keep the following endpoints definied here only if you are not keeping your skylab executables in the default cgi directory. If you do keep them there, you will need to keep `users` and `users.yaml` in the `bin_root` as well (see comment at top of file).

[cgi.archive]
host = %(skylab_host)s
path = /archive
cwd = %(skylab_cwd)s
command = ./archive

